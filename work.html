<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>作品</title>
  <script>
    // 作品頁現在放在 index.html 裡了。
    // 舊的網址（work.html?id=作品代號）會自動轉到新的網址（index.html#作品代號）。
    var id = new URLSearchParams(location.search).get("id");
    location.replace("./" + (id ? "#" + encodeURIComponent(id) : ""));
  </script>
</head>
<body style="margin:0;padding:40px 20px;background:#000;color:#f4f3ef;font-family:sans-serif">
  <p><a href="./" style="color:inherit">回首頁 / Home</a></p>
</body>
</html>
